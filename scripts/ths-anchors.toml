# Version-pinned facts in the ths-* skills, each tied to the source that
# makes it true in zcashlabs/thus-spoke-zakura. scripts/check_drift.py fails
# when a skill passage or its evidence changes, so the claim gets re-verified
# instead of silently going stale.
#
# [[anchor]]  A claim the skills make about THS.
#   skills    Where the claim appears: `file` plus an exact `text` excerpt.
#             If the excerpt is gone, the skill was edited and this anchor
#             needs updating too.
#   evidence  What THS must still contain for the claim to hold: `file` plus
#             `contains` (exact text, whitespace-insensitive), `regex`
#             (Python re, multiline), or `absent` (text that must NOT appear).
#
# [[value]]   A literal the skills repeat, compared with THS's current value.
#   source    `file` plus `regex` with one capture group: the current value.
#   pattern   Regex matched across every skill/README markdown file; each
#             match must equal the captured value.
#
# When THS changes on purpose, fix every skill that states the old fact
# (grep for it, per AGENTS.md), then update the evidence here.

ref_scope = ["skills/ths/**", "skills/ths-*/**"]

# Backticked tokens in ref_scope that are not THS repository references.
ignore_refs = [
  "linux/amd64",            # Docker platform strings
  "linux/arm64",
  "vX.Y.Z",                 # placeholder tag
  "zakuracore/zakura",      # image repository, checked by [[value]] below
  "tm-miner",               # placeholder address in test config
]

[[anchor]]
id = "regtest-activation-heights"
claim = "THS Regtest activates every network upgrade through NU6.3 at height 1; NU7 is not active."
skills = [
  { file = "skills/ths/SKILL.md", text = "activates every network upgrade through NU6.3 at height 1" },
]
evidence = [
  { file = "crates/ths-server/src/wallet.rs", contains = "nu6_3: one," },
  { file = "crates/ths-server/src/wallet.rs", contains = "nu7: None," },
  { file = "crates/ths-server/src/main.rs", contains = "\"NU6.3\" = 1" },
  { file = "crates/ths-server/src/main.rs", absent = "\"NU7\" = 1" },
]

