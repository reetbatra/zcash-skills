[[anchor]]
id = "cleanup-ownership-gap"
claim = "Instance cleanup deletes Docker resources by name without checking ownership labels, and the network is created without a label."
skills = [
  { file = "skills/ths/SKILL.md", text = "The current launcher has a resource-ownership gap documented in `ths-runtime`" },
  { file = "skills/ths-runtime/references/launcher-runtime.md", text = "the network is created without one, and `delete_instance_resources` still deletes by name without verifying labels" },
  { file = "skills/ths-runtime/references/launcher-runtime.md", text = "`delete_instance_resources` removes these names without checking the `com.zakura.ths.instance` label" },
]
evidence = [
  { file = "crates/ths-cli/src/runtime.rs", regex = 'fn delete_instance_resources\(&self, name: &InstanceName\)' },
  { file = "crates/ths-cli/src/runtime.rs", contains = 'docker(["rm", "-f", &target])' },
  { file = "crates/ths-cli/src/runtime.rs", contains = 'docker(["network", "create", prefix])?;' },
  { file = "crates/ths-cli/src/runtime.rs", contains = 'format!("com.zakura.ths.instance={name}")' },
]

